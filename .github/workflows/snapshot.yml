# Every Monday, and on demand: rewrites the data the page reads (snapshot.py) and commits what
# changed, which publishes it.
name: Snapshot

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency: snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: python3 snapshot.py
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      - name: Commit what changed
        run: |
          git add catalogue.json citations.json works.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Snapshot of the catalogs, citations and works"
          git push
